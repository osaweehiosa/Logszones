<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGSZONE | Real-Time Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://js.paystack.co/v1/inline.js"></script> 
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');
        body { background-color: #020617; color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-paystack { background: #09a5db; color: white; transition: all 0.3s ease; }
        .btn-paystack:hover { background: #0784af; transform: translateY(-2px); }
        .midnight-card { background: #0a192f; border: 1px solid #1e293b; transition: all 0.3s ease; }
        .category-dropdown { background: #1e293b; border: 1px solid #334155; color: white; padding: 10px; border-radius: 12px; width: 100%; outline: none; }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        #transaction-feed {
            height: 250px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #3b82f6 #0a192f;
        }
        #transaction-feed::-webkit-scrollbar { width: 6px; }
        #transaction-feed::-webkit-scrollbar-track { background: #0a192f; }
        #transaction-feed::-webkit-scrollbar-thumb { background-color: #3b82f6; border-radius: 20px; }

        #pseudo-notification {
            position: fixed; bottom: 20px; left: 20px; z-index: 100;
            background: rgba(15, 23, 42, 0.9); border: 1px solid #3b82f6;
            padding: 12px 20px; border-radius: 15px; display: none;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body class="min-h-screen bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-slate-900 via-blue-950 to-black">

    <nav class="p-5 glass sticky top-0 z-50 flex justify-between items-center px-6 lg:px-20">
        <h1 class="text-2xl font-800 tracking-tighter italic">LOGS<span class="text-blue-500">ZONE</span></h1>
        <div class="flex items-center gap-3">
            <div id="cart-display" class="hidden mr-4 bg-blue-600/20 px-3 py-1 rounded-lg border border-blue-500/30">
                <button onclick="toggleCartModal()" class="text-xs font-bold text-blue-400">
                    <i class="fas fa-shopping-cart mr-1"></i> Cart (<span id="cart-count">0</span>)
                </button>
            </div>
            <span class="text-xs bg-green-500/20 text-green-400 px-3 py-1 rounded-full border border-green-500/30">Live Server</span>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto p-6 mt-6">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-12">
            <div class="lg:col-span-2 bg-gradient-to-br from-blue-900 to-indigo-950 p-8 rounded-[2rem] shadow-2xl relative overflow-hidden border border-white/10">
                <div class="relative z-10">
                    <p id="welcomeMessage" class="text-blue-200/70 text-[10px] font-bold uppercase tracking-widest">Your Balance</p>
                    <h2 class="text-5xl font-800 my-2 tracking-tighter">₦<span id="wallet-balance">0.00</span></h2>
                    
                    <div class="flex gap-4 mt-6">
                        <button onclick="payWithPaystack()" class="btn-paystack px-8 py-3 rounded-xl font-bold flex items-center gap-3 shadow-lg text-sm">
                            <i class="fas fa-plus-circle"></i> Add Funds
                        </button>
                    </div>
                </div>
                <div class="absolute -bottom-20 -right-20 w-60 h-60 bg-blue-500/10 rounded-full blur-3xl"></div>
            </div>

            <div class="glass p-6 rounded-[2rem] flex flex-col border border-white/5">
                <h3 class="font-bold mb-4 text-slate-300 flex items-center justify-between text-sm">
                    <span>Recent Transactions</span>
                    <i class="fas fa-sync-alt text-[10px] animate-spin text-blue-500"></i>
                </h3>
                <div id="transaction-feed" class="space-y-4 pr-2">
                    <p id="no-trans" class="text-slate-500 text-xs italic text-center py-6">Waiting for first transaction...</p>
                </div>
            </div>
        </div>

        <section class="mt-12">
            <div class="mb-10 p-6 glass rounded-[2rem] border-dashed border-2 border-blue-500/30 text-center">
                <h3 class="text-lg font-bold mb-2">Foreign Numbers</h3>
                <p class="text-slate-400 mb-4 text-xs">Tap below to purchase premium foreign numbers via our telegram portal.</p>
                <a href="https://t.me/logszon3" target="_blank" class="inline-flex items-center gap-2 bg-[#229ED9] hover:bg-[#1c84b5] px-6 py-2 rounded-xl text-sm font-bold transition-all">
                    <i class="fab fa-telegram"></i> Message Admin for Numbers
                </a>
            </div>

            <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 px-2 gap-4">
                <div>
                    <h2 class="text-xl font-800 tracking-tight text-white uppercase">Marketplace Inventory</h2>
                    <p class="text-slate-400 text-[10px] mt-1">Select a category to browse logs</p>
                </div>
                <div class="w-full md:w-72">
                    <select id="categorySelector" onchange="scrollToCategory(this.value)" class="category-dropdown font-bold text-sm">
                        <option value="">Choose Category...</option>
                    </select>
                </div>
            </div>

            <div id="logs-container" class="space-y-12 pb-20"></div>
        </section>
    </div>

    <div id="cartModal" class="fixed inset-0 bg-black/80 z-[100] hidden items-center justify-center p-4">
        <div class="glass w-full max-w-md rounded-3xl p-6 border border-blue-500/30">
            <h3 class="text-xl font-800 mb-4 flex justify-between">
                Your Cart <button onclick="toggleCartModal()"><i class="fas fa-times text-slate-400"></i></button>
            </h3>
            <div id="cart-items" class="space-y-3 mb-6 max-h-60 overflow-y-auto pr-2"></div>
            <div class="border-t border-white/10 pt-4">
                <div class="flex justify-between font-bold mb-6">
                    <span>Total:</span>
                    <span class="text-blue-400">₦<span id="cart-total">0</span></span>
                </div>
                <button onclick="checkoutCart()" class="w-full py-4 bg-blue-600 rounded-2xl font-800 hover:bg-blue-500 transition-all">
                    Purchase & Contact Admin
                </button>
            </div>
        </div>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCcWUN1NBoKcnJnHw1aLYQ4xsJELP2OahU",
        authDomain: "logszone-marketplace.firebaseapp.com",
        databaseURL: "https://logszone-marketplace-default-rtdb.firebaseio.com",
        projectId: "logszone-marketplace",
        storageBucket: "logszone-marketplace.firebasestorage.app",
        messagingSenderId: "227518219335",
        appId: "1:227518219335:web:f286c4c4ce24c8a04b9d62"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const PAYSTACK_PUBLIC_KEY = 'pk_live_fe0e1ba1c33344fdeb2b31166eaffda103883dd3'; 
    
    let walletBalance = 0;
    let cart = [];
    const currentUser = localStorage.getItem('currentUser');
    let adminTelegram = "https://t.me/logszon3"; 

    const CATEGORIES = [
        { id: "tools", name: "All tools & tutorial update" },
        { id: "fb-random", name: "Aged & new random facebook" },
        { id: "fb-countries", name: "countries facebook" },
        { id: "fb-usa", name: "HQ USA FACEBOOK" },
        { id: "fb-page", name: "CREATE ANOTHER PAGE FACEBOOK" },
        { id: "discord", name: "DISCORD NEW AND AGED ACCOUNTS" },
        { id: "tiktok", name: "TIKTOK ACCOUNTS" },
        { id: "twitter", name: "TWITTER ACCOUNTS" },
        { id: "instagram", name: "INSTAGRAM ACCOUNT" },
        { id: "mails", name: "MAILS ACCOUNTS" },
        { id: "reddit", name: "REDDIT" },
        { id: "snapchat", name: "SNAPCHAT ACCOUNT" },
        { id: "vpn", name: "PAID PREMIUM VPN FOR PHONE" }
    ];

    const platformLogos = {
        'tools': 'fa-screwdriver-wrench',
        'fb-random': 'fa-brands fa-facebook',
        'fb-countries': 'fa-brands fa-facebook-f',
        'fb-usa': 'fa-flag-usa',
        'fb-page': 'fa-file-invoice',
        'discord': 'fa-brands fa-discord',
        'tiktok': 'fa-brands fa-tiktok',
        'twitter': 'fa-brands fa-twitter',
        'instagram': 'fa-brands fa-instagram',
        'mails': 'fa-envelope',
        'reddit': 'fa-brands fa-reddit-alien',
        'snapchat': 'fa-brands fa-snapchat',
        'vpn': 'fa-shield-halved'
    };

    function loadCart() {
        if (currentUser) {
            const savedCart = localStorage.getItem(`cart_${currentUser}`);
            cart = savedCart ? JSON.parse(savedCart) : [];
        }
    }

    function saveCart() {
        if (currentUser) {
            localStorage.setItem(`cart_${currentUser}`, JSON.stringify(cart));
        }
    }

    function saveBalance() {
        if (currentUser) {
            localStorage.setItem(`wallet_${currentUser}`, walletBalance);
        }
    }

    function loadBalance() {
        if (currentUser) {
            const savedBalance = localStorage.getItem(`wallet_${currentUser}`);
            walletBalance = savedBalance ? parseFloat(savedBalance) : 0;
        }
    }

    function updateUI() {
        document.getElementById('wallet-balance').innerText = walletBalance.toLocaleString(undefined, {minimumFractionDigits: 2});
        saveBalance();
        saveCart();
        updateCartDisplay();
    }

    function initFirebaseListeners() {
        db.ref('products').on('value', (snapshot) => {
            const data = snapshot.val();
            const products = data ? Object.values(data) : [];
            renderMarketplace(products);
        });

        db.ref('settings/telegram').on('value', (snapshot) => {
            if (snapshot.val()) adminTelegram = snapshot.val();
        });
    }

    function renderMarketplace(products) {
        const container = document.getElementById('logs-container');
        const selector = document.getElementById('categorySelector');

        let selectorHTML = '<option value="">Choose Category...</option>';
        CATEGORIES.forEach(cat => {
            const count = products.filter(l => l.platform === cat.id).length;
            selectorHTML += `<option value="${cat.id}">${cat.name} (${count})</option>`;
        });
        selector.innerHTML = selectorHTML;

        if (products.length === 0) {
            container.innerHTML = `<div class="p-12 text-center midnight-card rounded-[2rem] border border-dashed border-slate-800"><p class="text-slate-500">The marketplace is currently empty.</p></div>`;
            return;
        }

        let finalHTML = '';
        CATEGORIES.forEach(cat => {
            const catLogs = products.filter(l => l.platform === cat.id);
            if (catLogs.length > 0) {
                finalHTML += `
                <div id="cat-section-${cat.id}" class="pt-4 fade-in">
                    <div class="flex items-center gap-4 mb-6">
                        <h3 class="text-blue-400 font-bold uppercase tracking-widest text-[10px]">${cat.name}</h3>
                        <div class="h-[1px] bg-slate-800 flex-grow"></div>
                        <span class="bg-slate-800 text-slate-400 px-3 py-1 rounded-lg text-[8px] font-bold">${catLogs.length} ITEMS</span>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${catLogs.map((log) => {
                            const iconClass = platformLogos[log.platform] || 'fa-box';
                            const iconPrefix = iconClass.includes('fa-brands') ? '' : 'fas';
                            
                            return `
                                <div class="midnight-card p-6 rounded-3xl hover:border-blue-500/50 group transition-all duration-300 shadow-lg relative overflow-hidden">
                                    <div class="flex justify-between items-start mb-6">
                                        <div class="w-10 h-10 bg-blue-600/10 rounded-xl flex items-center justify-center group-hover:bg-blue-600 transition-colors">
                                            <i class="${iconPrefix} ${iconClass} text-blue-500 group-hover:text-white text-lg"></i>
                                        </div>
                                        <div class="text-right">
                                            <span class="text-xl font-800 text-white">₦${parseInt(log.price).toLocaleString()}</span>
                                        </div>
                                    </div>
                                    <h4 class="font-bold text-base text-slate-100 mb-1">${log.title}</h4>
                                    <p class="text-slate-400 text-[8px] uppercase font-bold tracking-tighter mb-6">${log.tag || 'Instant Delivery'}</p>
                                    
                                    <div class="flex gap-2">
                                        <button onclick="addToCart('${log.id}', ${log.price}, '${log.title.replace(/'/g, "\\'")}')" 
                                                class="flex-1 py-3 bg-slate-800 rounded-xl font-bold text-xs text-white hover:bg-slate-700 transition-all">
                                            Add To Cart
                                        </button>
                                        <button onclick="processPurchase('${log.id}', ${log.price}, '${log.title.replace(/'/g, "\\'")}')" 
                                                class="flex-1 py-3 bg-blue-600 rounded-xl font-bold text-xs text-white hover:bg-blue-500 transition-all">
                                            Buy Now
                                        </button>
                                    </div>
                                </div>`;
                        }).join('')}
                    </div>
                </div>`;
            }
        });
        container.innerHTML = finalHTML;
    }

    function addToCart(id, price, title) {
        cart.push({id, price, title, cartUniqueId: Date.now() + Math.random()});
        updateUI();
        alert(`✅ Added ${title} to cart!`);
    }

    function toggleCartModal() {
        const modal = document.getElementById('cartModal');
        modal.classList.toggle('hidden');
        modal.classList.toggle('flex');
        renderCartItems();
    }

    function updateCartDisplay() {
        const display = document.getElementById('cart-display');
        const count = document.getElementById('cart-count');
        if (cart.length > 0) {
            display.classList.remove('hidden');
            count.innerText = cart.length;
        } else {
            display.classList.add('hidden');
        }
    }

    function renderCartItems() {
        const container = document.getElementById('cart-items');
        const totalSpan = document.getElementById('cart-total');
        let total = 0;
        
        container.innerHTML = cart.map((item, index) => {
            total += item.price;
            return `
                <div class="flex justify-between items-center bg-white/5 p-3 rounded-xl border border-white/5">
                    <div>
                        <p class="text-sm font-bold">${item.title}</p>
                        <p class="text-xs text-blue-400">₦${item.price.toLocaleString()}</p>
                    </div>
                    <button onclick="removeFromCart(${index})" class="text-red-400"><i class="fas fa-trash-alt"></i></button>
                </div>
            `;
        }).join('');
        
        if(cart.length === 0) container.innerHTML = '<p class="text-center text-slate-500 py-4">Your cart is empty</p>';
        totalSpan.innerText = total.toLocaleString();
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        updateUI();
        renderCartItems();
    }

    function checkoutCart() {
        const total = cart.reduce((sum, item) => sum + item.price, 0);
        if (cart.length === 0) return;
        
        if (walletBalance < total) {
            alert("❌ Insufficient balance to pay for cart!");
            return;
        }
        
        if (confirm(`Checkout ${cart.length} items for ₦${total.toLocaleString()}?`)) {
            const productNames = cart.map(item => item.title).join(", ");
            const qty = cart.length;
            const paidAmount = total;
            
            walletBalance -= total;
            cart.forEach(item => logTx(`Bought: ${item.title}`, item.price, false));
            
            const message = `hi i am ${currentUser} and i want to buy ${productNames}, the number of the particular product is ${qty} and the amount which has already been paid before the redirection is ₦${paidAmount.toLocaleString()}`;
            
            cart = [];
            updateUI();
            toggleCartModal();
            
            alert("✅ Payment Successful! Redirecting to Admin...");
            window.open(`${adminTelegram}?text=${encodeURIComponent(message)}`, '_blank');
        }
    }

    function processPurchase(id, price, title) {
        if (walletBalance < price) {
            alert("❌ Insufficient Funds! Please fund your wallet.");
            return;
        }
        if (confirm(`Confirm purchase for ${title}? ₦${price.toLocaleString()} will be deducted.`)) {
            walletBalance -= price;
            logTx(`Bought: ${title}`, price, false);
            updateUI();
            
            const message = `hi i am ${currentUser} and i want to buy ${title}, the number of the particular product is 1 and the amount which has already been paid before the redirection is ₦${price.toLocaleString()}`;
            
            alert("✅ Purchase successful! Redirecting to contact admin.");
            window.open(`${adminTelegram}?text=${encodeURIComponent(message)}`, '_blank');
        }
    }

    function logTx(label, amount, isDeposit) {
        const feed = document.getElementById('transaction-feed');
        const noTrans = document.getElementById('no-trans');
        if (noTrans) noTrans.remove();
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const item = `
            <div class="flex justify-between items-center bg-white/5 p-3 rounded-xl border border-white/5 fade-in">
                <div>
                    <p class="text-[10px] font-bold text-slate-200">${label}</p>
                    <p class="text-[8px] text-slate-500">${time}</p>
                </div>
                <span class="${isDeposit ? 'text-green-400' : 'text-red-400'} font-bold text-xs">
                    ${isDeposit ? '+' : '-'}₦${amount.toLocaleString()}
                </span>
            </div>
        `;
        feed.insertAdjacentHTML('afterbegin', item);
    }

   // --- UPDATED FUNDING LOGIC WITH EMAIL FIX ---
    function payWithPaystack() {
        let amountInput = prompt("Enter amount to fund (₦):", "1000");
        if (!amountInput || isNaN(amountInput) || parseFloat(amountInput) <= 0) return;
        
        const floatAmount = parseFloat(amountInput);

        // CLEAN THE EMAIL: Remove spaces and handle empty usernames
        let cleanUser = currentUser ? currentUser.replace(/\s+/g, '').toLowerCase() : "customer";
        let userEmail = cleanUser + "@gmail.com";

        let handler = PaystackPop.setup({
            key: PAYSTACK_PUBLIC_KEY,
            email: userEmail, // Now guaranteed to be a valid format
            amount: Math.round(floatAmount * 100), 
            currency: "NGN",
            callback: function(response) {
                walletBalance += floatAmount;
                updateUI();
                logTx('Wallet Deposit', floatAmount, true);
                alert("Funding Successful! Your balance has been updated.");
            },
            onClose: function() {
                alert('Transaction cancelled.');
            }
        });
        handler.openIframe();
    }

    window.onload = function() {
        if (!currentUser) {
            window.location.href = 'index.html'; 
        } else {
            document.getElementById('welcomeMessage').innerText = `Welcome, ${currentUser}`;
            loadBalance();
            loadCart();
            initFirebaseListeners();
        }
        updateUI();
    };

    function scrollToCategory(id) {
        if(!id) return;
        const element = document.getElementById('cat-section-' + id);
        if(element) element.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

</script>
</body>
</html>
