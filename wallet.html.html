<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGSZONE | Real-Time Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://js.paystack.co/v1/inline.js"></script> 
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');
        body { background-color: #020617; color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-paystack { background: #09a5db; color: white; transition: all 0.3s ease; }
        .btn-paystack:hover { background: #0784af; transform: translateY(-2px); }
        .midnight-card { background: #0a192f; border: 1px solid #1e293b; transition: all 0.3s ease; }
        .category-dropdown { background: #1e293b; border: 1px solid #334155; color: white; padding: 10px; border-radius: 12px; width: 100%; outline: none; }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-slate-900 via-blue-950 to-black">

    <nav class="p-5 glass sticky top-0 z-50 flex justify-between items-center px-6 lg:px-20">
        <h1 class="text-2xl font-800 tracking-tighter italic">LOGS<span class="text-blue-500">ZONE</span></h1>
        <div class="flex items-center gap-3">
            <span class="text-xs bg-green-500/20 text-green-400 px-3 py-1 rounded-full border border-green-500/30">Live Server</span>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto p-6 mt-6">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-12">
            <div class="lg:col-span-2 bg-gradient-to-br from-blue-900 to-indigo-950 p-10 rounded-[2.5rem] shadow-2xl relative overflow-hidden border border-white/10">
                <div class="relative z-10">
                    <p id="welcomeMessage" class="text-blue-200/70 text-sm font-bold uppercase tracking-widest">Your Balance</p>
                    <h2 class="text-6xl font-800 my-4 tracking-tighter">₦<span id="wallet-balance">0.00</span></h2>
                    
                    <div class="flex gap-4 mt-8">
                        <button onclick="payWithPaystack()" class="btn-paystack px-10 py-4 rounded-2xl font-800 flex items-center gap-3 shadow-lg">
                            <i class="fas fa-plus-circle text-xl"></i> Add Funds
                        </button>
                    </div>
                </div>
                <div class="absolute -bottom-20 -right-20 w-80 h-80 bg-blue-500/10 rounded-full blur-3xl"></div>
            </div>

            <div class="glass p-6 rounded-[2.5rem] flex flex-col border border-white/5">
                <h3 class="font-bold mb-4 text-slate-300 flex items-center justify-between">
                    <span>Recent Transactions</span>
                    <i class="fas fa-sync-alt text-xs animate-spin text-blue-500"></i>
                </h3>
                <div id="transaction-feed" class="space-y-4 overflow-y-auto max-h-[250px] pr-2 custom-scrollbar">
                    <p id="no-trans" class="text-slate-500 text-sm italic text-center py-10">Waiting for first transaction...</p>
                </div>
            </div>
        </div>

        <section class="mt-12">
            <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 px-2 gap-4">
                <div>
                    <h2 class="text-2xl font-800 tracking-tight text-white uppercase">Marketplace Inventory</h2>
                    <p class="text-slate-400 text-xs mt-1">Select a category to browse logs</p>
                </div>
                <div class="w-full md:w-72">
                    <select id="categorySelector" onchange="scrollToCategory(this.value)" class="category-dropdown font-bold">
                        <option value="">Choose Category...</option>
                    </select>
                </div>
            </div>

            <div id="logs-container" class="space-y-12 pb-20">
                </div>

            <div class="mt-10 p-8 glass rounded-[2rem] border-dashed border-2 border-blue-500/30 text-center">
                <h3 class="text-xl font-bold mb-4">Foreign Numbers</h3>
                <p class="text-slate-400 mb-6 text-sm">Tap below to purchase premium foreign numbers via our telegram portal.</p>
                <a href="https://t.me/logszon3" target="_blank" class="inline-flex items-center gap-2 bg-[#229ED9] hover:bg-[#1c84b5] px-8 py-3 rounded-xl font-bold transition-all">
                    <i class="fab fa-telegram"></i> Message Admin for Numbers
                </a>
            </div>
        </section>
    </div>

<script>
    const PAYSTACK_PUBLIC_KEY = 'pk_test_244010503480c1c30a88bf74b2e7f56642e1fd02'; 
    
    let walletBalance = 0;
    const currentUser = localStorage.getItem('currentUser');

    const CATEGORIES = [
        { id: "tools", name: "All tools & tutorial update" },
        { id: "fb-random", name: "Aged & new random facebook" },
        { id: "fb-countries", name: "countries facebook" },
        { id: "fb-usa", name: "HQ USA FACEBOOK" },
        { id: "fb-page", name: "CREATE ANOTHER PAGE FACEBOOK" },
        { id: "discord", name: "DISCORD NEW AND AGED ACCOUNTS" },
        { id: "tiktok", name: "TIKTOK ACCOUNTS" },
        { id: "twitter", name: "TWITTER ACCOUNTS" },
        { id: "instagram", name: "INSTAGRAM ACCOUNT" },
        { id: "mails", name: "MAILS ACCOUNTS" },
        { id: "reddit", name: "REDDIT" },
        { id: "snapchat", name: "SNAPCHAT ACCOUNT" },
        { id: "vpn", name: "PAID PREMIUM VPN FOR PHONE" }
    ];

    function saveBalance() {
        if (currentUser) {
            localStorage.setItem(`wallet_${currentUser}`, walletBalance);
        }
    }

    function loadBalance() {
        if (currentUser) {
            const savedBalance = localStorage.getItem(`wallet_${currentUser}`);
            walletBalance = savedBalance ? parseFloat(savedBalance) : 0;
        }
    }

    function updateUI() {
        document.getElementById('wallet-balance').innerText = walletBalance.toLocaleString(undefined, {minimumFractionDigits: 2});
        saveBalance();
        renderMarketplace();
    }

    function logTx(label, amount, isDeposit) {
        const feed = document.getElementById('transaction-feed');
        const noTrans = document.getElementById('no-trans');
        if (noTrans) noTrans.remove();
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const item = `
            <div class="flex justify-between items-center bg-white/5 p-3 rounded-xl border border-white/5 fade-in">
                <div>
                    <p class="text-xs font-bold text-slate-200">${label}</p>
                    <p class="text-[10px] text-slate-500">${time}</p>
                </div>
                <span class="${isDeposit ? 'text-green-400' : 'text-red-400'} font-bold text-sm">
                    ${isDeposit ? '+' : '-'}₦${amount.toLocaleString()}
                </span>
            </div>
        `;
        feed.insertAdjacentHTML('afterbegin', item);
    }

    function scrollToCategory(id) {
        if(!id) return;
        const element = document.getElementById('cat-section-' + id);
        if(element) element.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function renderMarketplace() {
        const container = document.getElementById('logs-container');
        const selector = document.getElementById('categorySelector');
        const logs = JSON.parse(localStorage.getItem('shared_logs')) || [];

        // Update Dropdown with counts
        let selectorHTML = '<option value="">Choose Category...</option>';
        CATEGORIES.forEach(cat => {
            const count = logs.filter(l => l.platform === cat.id).length;
            selectorHTML += `<option value="${cat.id}">${cat.name} (${count})</option>`;
        });
        selector.innerHTML = selectorHTML;

        if (logs.length === 0) {
            container.innerHTML = `<div class="p-12 text-center midnight-card rounded-[2rem] border border-dashed border-slate-800"><p class="text-slate-500">The marketplace is currently empty.</p></div>`;
            return;
        }

        // Render sections for each category
        let finalHTML = '';
        CATEGORIES.forEach(cat => {
            const catLogs = logs.filter(l => l.platform === cat.id);
            if (catLogs.length > 0) {
                finalHTML += `
                <div id="cat-section-${cat.id}" class="pt-4 fade-in">
                    <div class="flex items-center gap-4 mb-6">
                        <h3 class="text-blue-400 font-bold uppercase tracking-widest text-sm">${cat.name}</h3>
                        <div class="h-[1px] bg-slate-800 flex-grow"></div>
                        <span class="bg-slate-800 text-slate-400 px-3 py-1 rounded-lg text-[10px] font-bold">${catLogs.length} ITEMS</span>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${catLogs.map((log) => {
                            const icon = log.platform.includes('fb') ? 'fa-facebook' :
                                         log.platform.includes('insta') ? 'fa-instagram' :
                                         log.platform.includes('twitter') ? 'fa-twitter' :
                                         log.platform.includes('tiktok') ? 'fa-tiktok' : 
                                         log.platform.includes('discord') ? 'fa-discord' : 'fa-shield-halved';
                            return `
                                <div class="midnight-card p-6 rounded-3xl hover:border-blue-500/50 group transition-all duration-300 shadow-lg relative overflow-hidden">
                                    <div class="flex justify-between items-start mb-6">
                                        <div class="w-12 h-12 bg-blue-600/10 rounded-2xl flex items-center justify-center group-hover:bg-blue-600 transition-colors">
                                            <i class="fab ${icon} text-blue-500 group-hover:text-white text-xl"></i>
                                        </div>
                                        <div class="text-right">
                                            <span class="text-2xl font-800 text-white">₦${parseInt(log.price).toLocaleString()}</span>
                                        </div>
                                    </div>
                                    <h4 class="font-bold text-lg text-slate-100 mb-1">${log.title}</h4>
                                    <p class="text-slate-400 text-[10px] uppercase font-bold tracking-tighter mb-6">${log.tag || 'Instant Delivery'}</p>
                                    
                                    <button onclick="processPurchase(${log.id}, ${log.price}, '${log.title}')" 
                                            id="btn-${log.id}"
                                            class="w-full py-4 bg-slate-800 rounded-2xl font-bold text-white hover:bg-blue-600 transition-all active:scale-95">
                                        Purchase Log
                                    </button>
                                    
                                    <div id="details-${log.id}" class="hidden mt-4 p-4 bg-green-500/10 border border-green-500/30 rounded-xl text-center">
                                        <p class="text-[10px] text-green-400 mb-2 uppercase font-bold">Access Link Unlocked</p>
                                        <a href="${log.data}" target="_blank" class="text-sm text-white font-bold underline flex items-center justify-center gap-2">
                                            <i class="fab fa-telegram"></i> Message Admin for Log
                                        </a>
                                    </div>
                                </div>`;
                        }).join('')}
                    </div>
                </div>`;
            }
        });
        container.innerHTML = finalHTML || `<p class="text-center text-slate-500">No active logs available.</p>`;
    }

    function processPurchase(id, price, title) {
        if (walletBalance < price) {
            alert("❌ Insufficient Funds! Please fund your wallet.");
            return;
        }
        if (confirm(`Confirm purchase for ${title}? ₦${price.toLocaleString()} will be deducted.`)) {
            walletBalance -= price;
            updateUI();
            logTx(`Bought: ${title}`, price, false);
            
            // Hide button and show the Telegram link
            document.getElementById(`btn-${id}`).classList.add('hidden');
            document.getElementById(`details-${id}`).classList.remove('hidden');
            
            // Auto-remove log from marketplace for other users after short delay
            setTimeout(() => {
                let logs = JSON.parse(localStorage.getItem('shared_logs')) || [];
                const updatedLogs = logs.filter(l => l.id !== id);
                localStorage.setItem('shared_logs', JSON.stringify(updatedLogs));
                renderMarketplace();
            }, 10000); 
        }
    }

    function payWithPaystack() {
        let amount = prompt("Enter amount to fund (₦):", "1000");
        if (!amount || isNaN(amount) || amount <= 0) return;
        let handler = PaystackPop.setup({
            key: PAYSTACK_PUBLIC_KEY,
            email: 'customer@logszone.com',
            amount: amount * 100, 
            currency: "NGN",
            callback: function(response) {
                walletBalance += parseFloat(amount);
                updateUI();
                logTx('Wallet Deposit', parseFloat(amount), true);
            }
        });
        handler.openIframe();
    }

    window.onload = function() {
        if (!currentUser) {
            window.location.href = 'index.html'; 
        } else {
            const displayArea = document.getElementById('welcomeMessage');
            if(displayArea) displayArea.innerText = `Welcome, ${currentUser}`;
            loadBalance();
        }
        updateUI();
    };

    window.addEventListener('storage', () => { renderMarketplace(); });
</script>
    
</body>
</html>
