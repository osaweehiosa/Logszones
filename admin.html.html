<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGSZONE | Admin Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { background-color: #020617; color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; }
        .admin-card { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(59, 130, 246, 0.2); backdrop-filter: blur(10px); }
        .input-style { background: #0f172a; border: 1px solid #1e293b; color: white; transition: all 0.3s; }
        .input-style:focus { border-color: #3b82f6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.2); outline: none; }
        .gradient-text { background: linear-gradient(to right, #60a5fa, #2563eb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-10 bg-[radial-gradient(circle_at_bottom_left,_var(--tw-gradient-stops))] from-blue-900/20 via-slate-950 to-black">

    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-12">
            <div>
                <h1 class="text-3xl font-800 tracking-tighter italic uppercase">Logs<span class="text-blue-500">Zone</span> <span class="text-xs bg-blue-600 px-2 py-1 rounded-md not-italic tracking-normal ml-2">Admin</span></h1>
                <p class="text-slate-400 text-sm mt-1">Global Inventory Control Panel</p>
            </div>
            <div class="text-right hidden md:block">
                <p class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">System Status</p>
                <p class="text-green-400 font-bold flex items-center gap-2 justify-end">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> Encrypted & Live
                </p>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-5">
                <div class="admin-card p-8 rounded-[2rem] shadow-2xl">
                    <h2 class="text-xl font-bold mb-6 flex items-center gap-3">
                        <i class="fas fa-cloud-upload-alt text-blue-500"></i> Deploy New Log
                    </h2>
                    
                    <div class="space-y-5">
                        <div>
                            <label class="text-xs font-bold text-slate-500 uppercase mb-2 block">Social Platform</label>
                            <select id="platform" class="w-full input-style p-4 rounded-2xl">
                                <option value="facebook">Facebook</option>
                                <option value="instagram">Instagram</option>
                                <option value="twitter">Twitter (X)</option>
                                <option value="tiktok">TikTok</option>
                                <option value="google">Google / Gmail</option>
                                <option value="other">Other Platform</option>
                            </select>
                        </div>

                        <div>
                            <label class="text-xs font-bold text-slate-500 uppercase mb-2 block">Log Title</label>
                            <input id="title" type="text" placeholder="e.g. 2015 USA Aged High Limit" class="w-full input-style p-4 rounded-2xl">
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="text-xs font-bold text-slate-500 uppercase mb-2 block">Price (₦)</label>
                                <input id="price" type="number" placeholder="5000" class="w-full input-style p-4 rounded-2xl">
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-500 uppercase mb-2 block">Badge/Tag</label>
                                <input id="tag" type="text" placeholder="e.g. HOT, 2FA" class="w-full input-style p-4 rounded-2xl">
                            </div>
                        </div>

                        <div>
                            <label class="text-xs font-bold text-blue-400 uppercase mb-2 block flex items-center gap-2">
                                <i class="fas fa-lock"></i> Hidden Credentials
                            </label>
                            <textarea id="data" placeholder="Email:Password:Cookies (Only visible after purchase)" class="w-full input-style p-4 rounded-2xl h-32"></textarea>
                        </div>

                        <button onclick="publishLog()" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-800 text-white transition-all transform active:scale-95 shadow-lg shadow-blue-600/20">
                            Push to Marketplace
                        </button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-7">
                <div class="admin-card p-8 rounded-[2rem] h-full">
                    <div class="flex justify-between items-center mb-8">
                        <h2 class="text-xl font-bold">Active Inventory</h2>
                        <span id="log-count" class="text-xs bg-slate-800 text-slate-300 px-4 py-1 rounded-full">0 Items Live</span>
                    </div>

                    <div class="overflow-y-auto max-h-[600px] pr-2 custom-scroll">
                        <table class="w-full text-left">
                            <thead class="text-slate-500 text-[10px] uppercase tracking-widest border-b border-slate-800">
                                <tr>
                                    <th class="pb-4">Platform</th>
                                    <th class="pb-4">Details</th>
                                    <th class="pb-4">Price</th>
                                    <th class="pb-4 text-right">Action</th>
                                </tr>
                            </thead>
                            <tbody id="inventory-list" class="divide-y divide-slate-800">
                                </tbody>
                        </table>
                        <div id="empty-msg" class="text-center py-20 text-slate-600 italic hidden">
                            No logs currently active in the market.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function publishLog() {
            const platform = document.getElementById('platform').value;
            const title = document.getElementById('title').value;
            const price = document.getElementById('price').value;
            const tag = document.getElementById('tag').value;
            const data = document.getElementById('data').value;

            if(!title || !price || !data) {
                alert("Please fill in the required fields (Title, Price, and Credentials)");
                return;
            }

            const logs = JSON.parse(localStorage.getItem('shared_logs')) || [];
            
            const newLog = {
                id: Date.now(),
                platform,
                title,
                price,
                tag: tag || 'Premium',
                data: data // This connects to the credential reveal in wallet.html
            };

            logs.push(newLog);
            localStorage.setItem('shared_logs', JSON.stringify(logs));
            
            // Clear form
            document.getElementById('title').value = '';
            document.getElementById('price').value = '';
            document.getElementById('tag').value = '';
            document.getElementById('data').value = '';

            alert("✅ Successfully Deployed to mark.html");
            renderInventory();
        }

        function renderInventory() {
            const list = document.getElementById('inventory-list');
            const logs = JSON.parse(localStorage.getItem('shared_logs')) || [];
            const countLabel = document.getElementById('log-count');
            const emptyMsg = document.getElementById('empty-msg');

            countLabel.innerText = `${logs.length} Items Live`;
            list.innerHTML = '';

            if(logs.length === 0) {
                emptyMsg.classList.remove('hidden');
                return;
            } else {
                emptyMsg.classList.add('hidden');
            }

            logs.forEach((log, index) => {
                const row = `
                    <tr class="group hover:bg-white/5 transition">
                        <td class="py-4">
                            <i class="fab fa-${log.platform} text-blue-500 text-lg"></i>
                        </td>
                        <td class="py-4">
                            <p class="text-sm font-bold text-slate-200">${log.title}</p>
                            <p class="text-[10px] text-slate-500 uppercase tracking-tighter">${log.tag}</p>
                        </td>
                        <td class="py-4 font-bold text-white text-sm">₦${parseInt(log.price).toLocaleString()}</td>
                        <td class="py-4 text-right">
                            <button onclick="removeLog(${index})" class="text-red-500 hover:text-red-400 p-2 transition">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </td>
                    </tr>
                `;
                list.insertAdjacentHTML('beforeend', row);
            });
        }

        function removeLog(index) {
            if(confirm("Are you sure you want to remove this log from the marketplace?")) {
                const logs = JSON.parse(localStorage.getItem('shared_logs')) || [];
                logs.splice(index, 1);
                localStorage.setItem('shared_logs', JSON.stringify(logs));
                renderInventory();
            }
        }

        // Initialize
        window.onload = renderInventory;
        // Listen for purchases from the wallet.html (it will remove items automatically)
        window.addEventListener('storage', renderInventory);
    </script>
</body>
</html>
