<div class="max-w-xl mx-auto mt-10 p-8 midnight-card rounded-[2.5rem]">
    <h2 class="text-2xl font-bold mb-6">Admin Panel</h2>
    <div class="space-y-4">
        <input id="plat" placeholder="Platform (facebook, instagram...)" class="w-full bg-slate-900 p-4 rounded-xl border border-slate-700 outline-none focus:border-blue-500">
        <input id="title" placeholder="Public Title (e.g. 2015 USA Aged)" class="w-full bg-slate-900 p-4 rounded-xl border border-slate-700">
        <input id="price" type="number" placeholder="Price (₦)" class="w-full bg-slate-900 p-4 rounded-xl border border-slate-700">
        <input id="tag" placeholder="Tag (e.g. HQ, HOT, 2FA)" class="bg-slate-900 p-4 rounded-xl border border-slate-700 w-full">
        
        <textarea id="data" placeholder="PASTE LOG CREDENTIALS HERE (Email:Pass:Cookies)" class="w-full bg-slate-900 p-4 rounded-xl border border-slate-700 h-32"></textarea>
        
        <button onclick="deployLog()" class="w-full py-4 bg-blue-600 rounded-2xl font-bold hover:bg-blue-500 transition">
            Publish to Global Market
        </button>
    </div>
</div>

<script>
    function deployLog() {
        const logs = JSON.parse(localStorage.getItem('global_logs')) || [];
        const newEntry = {
            platform: document.getElementById('plat').value,
            title: document.getElementById('title').value,
            price: parseInt(document.getElementById('price').value),
            tag: document.getElementById('tag').value,
            data: document.getElementById('data').value, // This stays hidden until purchase
            id: Date.now()
        };

        if(!newEntry.data || !newEntry.price) return alert("Please fill all fields");

        logs.push(newEntry);
        localStorage.setItem('global_logs', JSON.stringify(logs));
        alert("✅ Log is now LIVE for all users.");
        
        // Reset form
        document.querySelectorAll('input, textarea').forEach(i => i.value = '');
    }
</script>
